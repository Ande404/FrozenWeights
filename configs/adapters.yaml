# Bottleneck adapters (Houlsby et al., 2019; AdapterHub DoubleSeqBnConfig): two adapters per layer,
# encoder frozen, classifier trained.
method: adapters
model_name: xlm-roberta-base
max_length: 256
adapter_reduction_factor: 16  # bottleneck 768 / 16 = 48
learning_rate: 5.0e-4        # search grid (Checkpoint 3): [1e-4, 5e-4, 1e-3]
num_train_epochs: 3
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
warmup_ratio: 0.1
weight_decay: 0.01
seeds: [1, 2, 3]
