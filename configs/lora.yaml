# LoRA: low-rank updates on attention + feed-forward projections; encoder weights frozen, classifier trained.
method: lora
model_name: xlm-roberta-base
max_length: 256
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
lora_target_modules: [query, key, value, dense]
learning_rate: 5.0e-4        # search grid (Checkpoint 2): [1e-4, 5e-4, 1e-3]
num_train_epochs: 3
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
warmup_ratio: 0.1
weight_decay: 0.01
seeds: [1, 2, 3]
